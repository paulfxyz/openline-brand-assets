<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Signature — Openline</title>
  <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body { background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; gap: 40px; }
    .preview-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; }
    .preview-wrap { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-width: 560px; width: 100%; }
    .copy-btn { margin-top: 16px; background: #ff6616; color: white; border: none; border-radius: 6px; padding: 8px 18px; font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: 0.3px; }
    .copy-btn:hover { background: #e55a0e; }
    textarea { width: 100%; height: 60px; font-size: 11px; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; color: #64748b; resize: none; margin-top: 8px; }
  </style>
</head>
<body>

<div style="max-width:560px;width:100%">
  <div class="preview-label">Preview — Openline · Brand</div>
  <div class="preview-wrap">

    <!-- SIGNATURE START -->
    <div id="sig-openline" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;color:#0f172a;max-width:480px">

      <table cellpadding="0" cellspacing="0" border="0" style="width:100%">
        <tr>
          <!-- Left: Openline logo block -->
          <td style="width:52px;vertical-align:top;padding-right:16px">
            <div style="width:48px;height:48px;background:#ff6616;border-radius:10px;display:flex;align-items:center;justify-content:center">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="28" height="28" style="display:block">
                <path fill="#ffffff" d="M605.3,71.1c21.98-3.42,74.26,13.16,96.4,21.11,335.27,120.38,421.03,551.24,158.99,794.43-261.37,242.56-684.82,121.56-778.57-219.93-10.02-36.49-25.96-85.94,27.19-94.08,58.99,3.03,122.76-4.46,181.19-.16,37.17,2.74,38.5,27.84,50.45,55.05,54.74,124.59,211.73,168.82,323.79,90.03,138.68-97.51,118.11-308.74-36.49-377.32-29.2-12.96-53.77-13.02-56.32-53.03-3.77-59.25,2.03-123.54,1.12-183.12,2.3-15.12,17.09-30.62,32.24-32.98Z"/>
                <path fill="#ffffff" d="M100.82,66.34l181-.26c20.57,3.15,35.08,19.15,36.92,39.81-3.12,55.88,4.21,116.37.05,171.71-1.71,22.78-17.93,39.52-40.77,41.72-55.91-3.21-116.39,4.16-171.76,0-21.2-1.59-37.8-16.79-40.76-37.89l.14-180.25c3.19-17.64,17.25-32.13,35.17-34.84Z"/>
              </svg>
            </div>
          </td>
          <!-- Right: info -->
          <td style="vertical-align:top">
            <div style="font-size:16px;font-weight:800;color:#0f172a;letter-spacing:-0.3px;line-height:1.2;font-family:'Play',Arial,sans-serif">Openline</div>
            <div style="font-size:12px;color:#64748b;margin-top:2px;margin-bottom:8px">Global eSIM Network&nbsp;&nbsp;·&nbsp;&nbsp;<a href="https://openline.io" style="color:#ff6616;text-decoration:none;font-weight:600">openline.io</a></div>

            <!-- Social icons row -->
            <table cellpadding="0" cellspacing="0" border="0">
              <tr>
                <!-- Email -->
                <td style="padding-right:10px">
                  <a href="mailto:hello@openline.io" title="Email" style="display:inline-block;text-decoration:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="4" width="20" height="16" rx="2" stroke="#ff6616" stroke-width="2"/><path d="m2 7 9.1 6.1a1.6 1.6 0 0 0 1.8 0L22 7" stroke="#ff6616" stroke-width="2" stroke-linecap="round"/></svg>
                  </a>
                </td>
                <!-- Website -->
                <td style="padding-right:10px">
                  <a href="https://openline.io" title="Website" style="display:inline-block;text-decoration:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="#ff6616" stroke-width="2"/><ellipse cx="12" cy="12" rx="4" ry="9" stroke="#ff6616" stroke-width="2"/><path d="M3 12h18" stroke="#ff6616" stroke-width="2" stroke-linecap="round"/></svg>
                  </a>
                </td>
                <!-- Cal.com -->
                <td style="padding-right:10px">
                  <a href="https://cal.com/paulfxyz" title="Book a call" style="display:inline-block;text-decoration:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="18" height="18" rx="2" stroke="#ff6616" stroke-width="2"/><path d="M16 2v4M8 2v4M3 10h18" stroke="#ff6616" stroke-width="2" stroke-linecap="round"/><rect x="7" y="14" width="3" height="3" rx="0.5" fill="#ff6616"/></svg>
                  </a>
                </td>
                <!-- LinkedIn -->
                <td style="padding-right:10px">
                  <a href="https://linkedin.com/company/openline" title="LinkedIn" style="display:inline-block;text-decoration:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="3" stroke="#ff6616" stroke-width="2"/><path d="M7 10v7M7 7v.5" stroke="#ff6616" stroke-width="2" stroke-linecap="round"/><path d="M12 17v-4a2 2 0 0 1 4 0v4M12 10v7" stroke="#ff6616" stroke-width="2" stroke-linecap="round"/></svg>
                  </a>
                </td>
                <!-- Instagram -->
                <td style="padding-right:10px">
                  <a href="https://instagram.com/openline" title="Instagram" style="display:inline-block;text-decoration:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="5" stroke="#ff6616" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="#ff6616" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1" fill="#ff6616"/></svg>
                  </a>
                </td>
                <!-- WhatsApp -->
                <td style="padding-right:10px">
                  <a href="https://wa.me/openline" title="WhatsApp" style="display:inline-block;text-decoration:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.9.53 3.67 1.44 5.18L2 22l4.96-1.41A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2Z" stroke="#ff6616" stroke-width="2"/><path d="M9 11c.3.7.8 1.3 1.4 1.8.6.5 1.3.9 2.1 1l1.2-1.2c.3-.3.7-.3 1 0l1.5 1.5c.3.3.3.8 0 1.1l-.7.7c-.4.4-.9.6-1.4.5-2.2-.4-4.5-2.7-4.9-4.9-.1-.5.1-1 .5-1.4l.7-.7c.3-.3.8-.3 1.1 0l1.5 1.5" stroke="#ff6616" stroke-width="1.8" stroke-linecap="round"/></svg>
                  </a>
                </td>
                <!-- Telegram -->
                <td style="padding-right:10px">
                  <a href="https://t.me/openline" title="Telegram" style="display:inline-block;text-decoration:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="#ff6616" stroke-width="2"/><path d="m7 12 3 3 7-6" stroke="#ff6616" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

      <!-- Orange accent divider -->
      <table cellpadding="0" cellspacing="0" border="0" style="width:100%;margin-top:14px">
        <tr><td style="background:linear-gradient(90deg,#ff6616,#ff8c42);height:2px;border-radius:2px;font-size:0;line-height:0"></td></tr>
      </table>

      <!-- Bottom micro row -->
      <table cellpadding="0" cellspacing="0" border="0" style="width:100%;margin-top:10px">
        <tr>
          <td style="font-size:11px;color:#94a3b8">
            <a href="mailto:hello@openline.io" style="color:#94a3b8;text-decoration:none">hello@openline.io</a>
            &nbsp;·&nbsp;
            <a href="https://cal.com/paulfxyz" style="color:#94a3b8;text-decoration:none">Book a call</a>
            &nbsp;·&nbsp;
            <a href="https://openline.io/esim" style="color:#94a3b8;text-decoration:none">Get your eSIM</a>
          </td>
        </tr>
      </table>

    </div>
    <!-- SIGNATURE END -->

  </div>
  <button class="copy-btn" onclick="copySig('sig-openline')">Copy signature HTML</button>
  <textarea id="sig-openline-out" readonly placeholder="HTML will appear here after copying..."></textarea>
</div>

<script>
function copySig(id) {
  const el = document.getElementById(id);
  const html = el.outerHTML;
  const ta = document.getElementById(id + '-out');
  ta.value = html;
  navigator.clipboard.writeText(html).then(() => {
    const btn = ta.previousElementSibling;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy signature HTML', 1800);
  });
}
</script>
</body>
</html>
