  <button class="copy-btn" onclick="copySig('sig-paul')">Copy signature HTML</button>
  <textarea id="sig-paul-out" readonly placeholder="HTML will appear here after copying..."></textarea>
</div>

<script>
function copySig(id) {
  const el = document.getElementById(id);
  const html = el.outerHTML;
  const ta = document.getElementById(id + '-out');
  ta.value = html;
  navigator.clipboard.writeText(html).then(() => {
    const btn = ta.previousElementSibling;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy signature HTML', 1800);
  });
}
</script>
