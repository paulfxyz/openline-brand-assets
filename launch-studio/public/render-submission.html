<!doctype html>
<html lang="en"><meta charset="UTF-8"><title>Openline store submission composition</title>
<style>
@font-face{font-family:Inter;src:url('./fonts/inter-latin-600-normal.woff2');font-weight:600}
@font-face{font-family:Inter;src:url('./fonts/inter-latin-800-normal.woff2');font-weight:800}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif}
#canvas{width:1320px;height:2868px;background:#ff6418;color:#171717;position:relative;overflow:hidden}
.brand{position:absolute;top:4%;left:8%;display:flex;align-items:center;gap:22px;font-size:64px;font-weight:800;letter-spacing:-2px;color:#fff}
.brand img{width:86px;height:86px;filter:brightness(0) invert(1)}
.copy{position:absolute;top:12%;left:8%;right:8%}
h1{font-size:106px;line-height:1.06;letter-spacing:-4.5px;font-weight:800;margin:0}h1 span{color:#fff}
.copy p{font-size:31px;font-weight:600;line-height:1.45;margin:26px 0 0;max-width:100%}
.capture{position:absolute;top:30%;bottom:4%;left:8%;right:8%;display:flex;justify-content:center}
.capture img{display:block;max-width:100%;height:100%;object-fit:contain;object-position:top;border-radius:26px;box-shadow:0 28px 60px #0002}
.alt{background:#fff5e9!important}.alt .brand{color:#171717}.alt .brand img{filter:brightness(0)}.alt h1 span{color:#d94f08}
#canvas.google{width:1080px;height:1920px}
.google .brand{font-size:45px;gap:16px}.google .brand img{width:60px;height:60px}
.google h1{font-size:82px;letter-spacing:-3px}.google .copy p{font-size:26px;margin-top:20px}
.google .capture{top:31%;bottom:4%}.google .capture img{border-radius:0}
#canvas.google.feature{width:1024px;height:500px}.feature .brand{top:10%;font-size:38px}.feature .brand img{width:50px;height:50px}.feature .copy{top:34%;right:40%}.feature h1{font-size:65px;letter-spacing:-2px}.feature .copy p{display:none}.google.feature .capture{top:20%;bottom:20%;left:64%;right:7%}.google.feature .capture img{width:100%;height:100%;border-radius:35px;object-fit:contain}
</style>
<main id="canvas"><div class="brand"><img src="./assets/mark.png" alt=""><span>Openline</span></div><div class="copy"><h1></h1><p></p></div><div class="capture"><img alt="Openline app design reference"></div></main>
<script type="module">
const config=await(await fetch('./submission.json')).json(),q=new URLSearchParams(location.search);
const platform=q.get('platform')==='google'?'google':'apple',n=Math.max(0,Math.min(5,Number(q.get('slide'))||0)),frame=config[platform].frames[n];
document.querySelector('#canvas').className=platform+(n%2?' alt':'');
document.querySelector('h1').replaceChildren(document.createTextNode(frame.head[0]),document.createElement('br'),Object.assign(document.createElement('span'),{textContent:frame.head[1]}));
document.querySelector('.copy p').textContent=frame.detail;
document.querySelector('.capture img').src='./assets/'+frame.capture;
if(platform==='google'&&q.get('format')==='feature'){
 document.querySelector('#canvas').className='google feature';
 document.querySelector('h1').replaceChildren(document.createTextNode('Travel data.'),document.createElement('br'),Object.assign(document.createElement('span'),{textContent:'In one place.'}));
 document.querySelector('.capture img').src='./assets/icon-43.5-light.png';
}
window.artworkReady=true;
</script></html>
