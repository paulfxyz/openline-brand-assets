<!doctype html>
<html lang="en"><meta charset="UTF-8"><title>Openline store submission composition</title>
<style>
@font-face{font-family:Inter;src:url('./fonts/inter-latin-600-normal.woff2');font-weight:600}
@font-face{font-family:Inter;src:url('./fonts/inter-latin-800-normal.woff2');font-weight:800}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif}
#canvas{width:1320px;height:2868px;background:#ff6418;color:#171717;position:relative;overflow:hidden}
.brand{position:absolute;top:4.2%;left:8%;display:flex;align-items:center;gap:24px;font-size:76px;font-weight:800;letter-spacing:-3px;color:#fff;z-index:4}
.brand img{width:104px;height:104px;filter:brightness(0) invert(1)}
.copy{position:absolute;top:13%;left:8%;right:7%;z-index:3}
h1{font-size:126px;line-height:1.04;letter-spacing:-6px;font-weight:800;margin:0}h1 span{color:#fff}
.copy p{font-size:32px;font-weight:600;line-height:1.5;margin:36px 0 0;max-width:95%}
.capture{position:absolute;top:36%;left:12%;width:80%;transform:rotate(-4deg);transform-origin:50% 15%;border:2px solid #ded6cc;border-radius:48px;overflow:hidden;background:#f8f9fb;box-shadow:0 36px 80px #0002;z-index:2}
.capture img{display:block;width:100%;height:auto}
.orb{position:absolute;width:1150px;height:1150px;background:#ff9e65;border-radius:50%;left:-590px;top:46%}
.alt{background:#fff5e9!important}.alt .brand{color:#171717}.alt .brand img{filter:brightness(0)}.alt h1 span{color:#e6550c}.alt .orb{background:#ffdec3}
.alt .capture{transform:rotate(4deg);left:8%}
.network .capture{top:34%;left:8%;width:84%;transform:rotate(-3deg)}
.market h1{font-size:150px}.market .capture{top:40%;left:8%;width:84%;transform:rotate(3deg)}
#canvas.google{width:1080px;height:1920px}
.google .brand{font-size:62px;gap:20px;letter-spacing:-2.5px}.google .brand img{width:85px;height:85px}
.google .copy{top:13.5%}.google h1{font-size:100px;letter-spacing:-4.5px}.google .copy p{font-size:25px;margin-top:26px}
.google .capture{top:38%;width:79%;border-radius:34px}
.google.network .capture{top:36%;left:8%;width:84%}
.google.market h1{font-size:122px;letter-spacing:-5px}.google.market .capture{top:42%;left:8%;width:84%}
#canvas.google.feature{width:1024px;height:500px}.feature .brand{top:10%;font-size:38px}.feature .brand img{width:50px;height:50px}.feature .copy{top:34%;right:40%}.feature h1{font-size:65px;letter-spacing:-2px}.feature .copy p,.feature .orb{display:none}.google.feature .capture{top:20%;bottom:20%;left:64%;right:7%;width:auto;transform:none;border:0;background:transparent;border-radius:35px}.google.feature .capture img{width:100%;height:100%;border-radius:35px;object-fit:contain}
</style>
<main id="canvas"><div class="orb"></div><div class="brand"><img src="./assets/mark.png" alt=""><span>Openline</span></div><div class="copy"><h1></h1><p></p></div><div class="capture"><img alt="Openline app design reference"></div></main>
<script type="module">
const config=await(await fetch('./submission.json')).json(),q=new URLSearchParams(location.search);
const platform=q.get('platform')==='google'?'google':'apple',n=Math.max(0,Math.min(5,Number(q.get('slide'))||0)),frame=config[platform].frames[n];
document.querySelector('#canvas').className=platform+(n%2?' alt':'')+(n===4?' network':n===5?' market':'');
document.querySelector('h1').replaceChildren(document.createTextNode(frame.head[0]),document.createElement('br'),Object.assign(document.createElement('span'),{textContent:frame.head[1]}));
document.querySelector('.copy p').textContent=frame.detail;
document.querySelector('.capture img').src='./assets/'+frame.capture;
if(platform==='google'&&q.get('format')==='feature'){
 document.querySelector('#canvas').className='google feature';
 document.querySelector('h1').replaceChildren(document.createTextNode('Travel data.'),document.createElement('br'),Object.assign(document.createElement('span'),{textContent:'In one place.'}));
 document.querySelector('.capture img').src='./assets/icon-43.5-light.png';
}
window.artworkReady=true;
</script></html>
