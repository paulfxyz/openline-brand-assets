<!doctype html>
<html lang="en"><meta charset="UTF-8"><title>Openline / Original orange / app-led review artwork</title>
<style>
@font-face{font-family:Inter;src:url('./fonts/inter-latin-600-normal.woff2');font-weight:600}
@font-face{font-family:Inter;src:url('./fonts/inter-latin-800-normal.woff2');font-weight:800}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif}
#canvas{position:relative;overflow:hidden;width:1320px;height:2868px;background:#ff6418;color:#171717}
.brand{position:absolute;top:4.2%;left:8%;display:flex;align-items:center;gap:24px;color:#fff;font-size:76px;font-weight:800;letter-spacing:-3px;line-height:1;z-index:4}
.brand img{width:104px;height:104px;filter:brightness(0) invert(1);object-fit:contain}
.category{position:absolute;top:5.2%;right:8%;font-size:20px;letter-spacing:2px;color:#fff;z-index:4}
.copy{position:absolute;left:8%;right:7%;top:13%;z-index:3}
h1{margin:0;font-size:126px;font-weight:800;line-height:1.04;letter-spacing:-6px}h1 span{color:#fff}
.copy p{margin:36px 0 0;font-size:42px;line-height:1.4;max-width:95%;font-weight:600;color:#fff}
.alt .copy p{color:#171717}
.phone{position:absolute;top:36%;left:12%;width:80%;border:9px solid #252525;border-radius:85px;overflow:hidden;background:#f8f9fb;box-shadow:0 36px 80px #0002;transform:rotate(-4deg);z-index:2}
.phone img{width:100%;display:block}
.orb{position:absolute;width:1150px;height:1150px;background:#ff9e65;border-radius:50%;left:-590px;top:46%}
.foot{position:absolute;left:0;right:0;bottom:0;padding:26px 20px;text-align:center;font-size:17px;letter-spacing:.7px;background:#ff6418;color:#351403;z-index:6}
.qualification{display:none;position:absolute;left:8%;right:8%;bottom:4.3%;z-index:5;font-size:21px;line-height:1.45;padding:18px 22px;border-radius:12px;background:#fff3e7;color:#351706}
.backdrop,.label,.index{display:none}
.alt{background:#fff5e9!important}.alt h1 span{color:#e6550c}.alt .orb{background:#ffdec3}
.alt .brand,.alt .category{color:#171717}.alt .brand img{filter:brightness(0)}
.alt .phone{transform:rotate(4deg);left:8%}.alt .foot{background:#fff5e9;color:#65564c}
.network h1,.market h1{font-size:115px;letter-spacing:-5px}
.network .phone,.market .phone{top:34%;left:8%;width:84%;transform:none;border:2px solid #ded6cc;border-radius:48px}
.network .qualification,.market .qualification{display:block}
.market .qualification{background:#ffe7d3}
#canvas.android{width:1080px;height:1920px}
.android .brand{gap:20px;font-size:62px;letter-spacing:-2.5px}.android .brand img{width:85px;height:85px}
.android .category{font-size:16px}.android h1{font-size:100px;letter-spacing:-4.5px}
.android .copy{top:13.5%}.android .copy p{font-size:34px;margin-top:26px}
.android .phone{top:38%;width:79%;left:12%;border:2px solid #ded6cc;border-radius:34px;transform:none}
.android .foot{font-size:13px;padding:20px}
.android.network h1,.android.market h1{font-size:93px;letter-spacing:-4px}
.android.network .phone,.android.market .phone{top:34%;left:8%;width:84%;border-radius:34px}
.android .qualification{font-size:16px;padding:14px 17px;bottom:4.3%}
.category,.qualification,.foot{display:none!important}
.market h1{font-size:150px;letter-spacing:-6px}
.market .phone{top:40%}
.android.market h1{font-size:122px;letter-spacing:-5px}
.android.market .phone{top:42%}
.android.network .phone{top:38%}
.ios.network .phone{transform:rotate(-3deg);transform-origin:50% 15%}
.ios.market .phone{transform:rotate(3deg);transform-origin:50% 15%}
</style>
<div id="canvas"><div class="backdrop"></div><div class="orb"></div><div class="brand"><img src="./assets/mark.png" alt=""><span>Openline</span></div><div class="category">TRAVEL eSIM</div><div class="copy"><h1></h1><p></p></div><div class="phone"><img id="screen" alt="Supplied Openline React UI reference"></div><div class="label"></div><div class="index"></div><div class="qualification"></div><div class="foot">DESIGN REFERENCE · SAMPLE DATA · REPLACE WITH VERIFIED NATIVE CAPTURE</div></div>
<script type="module">
const [config,art]=await Promise.all(['series.json','artwork.json'].map(async p=>(await fetch('./'+p)).json()));
const q=new URLSearchParams(location.search),n=Math.max(0,Math.min(5,Number(q.get('slide'))||0)),s=config.series.find(x=>x.id===q.get('series'))||config.series[0],sourceIndex=config.sourceOrder?.[n]??n,slide=art.slides[sourceIndex],platform=q.get('platform')==='android'?'android':'ios';
const network=n===config.differentiator.slide,market=n===config.market.slide,story=network?config.differentiator:market?config.market:null,override=config.frameOverrides?.[n];
const canvas=document.querySelector('#canvas');canvas.className=s.id+' '+platform+(network?' network':market?' market':'')+(n%2?' alt':'');
const heads=platform==='android'&&config.androidHeadlines?.[n]?config.androidHeadlines[n]:s.heads[n];
document.querySelector('h1').replaceChildren(document.createTextNode(heads[0]),document.createElement('br'),Object.assign(document.createElement('span'),{textContent:heads[1]}));
document.querySelector('.copy p').textContent=platform==='android'&&story?.androidDetail?story.androidDetail:story?.detail||override?.detail||slide.detail;
document.querySelector('#screen').src=story?.captures?.[platform]||override?.captures?.[platform]||slide.captures[platform];
document.querySelector('.qualification').textContent=story?.qualification||'';
window.artworkReady=true;
</script></html>
