<!doctype html>
<html lang="en"><meta charset="UTF-8"><title>Openline / five directions / review artwork</title>
<style>
@font-face{font-family:Inter;src:url('./fonts/inter-latin-600-normal.woff2');font-weight:600}
@font-face{font-family:Inter;src:url('./fonts/inter-latin-800-normal.woff2');font-weight:800}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif}
#canvas{position:relative;overflow:hidden;width:1320px;height:2868px;background:#ff6418;color:#171717;--w:1320px;--h:2868px}
.brand{position:absolute;top:4.5%;left:8%;display:flex;align-items:center;gap:18px;font-size:40px;font-weight:800;letter-spacing:-1.7px;z-index:4}
.brand img{width:51px;height:51px;object-fit:contain;filter:brightness(0)}
.category{position:absolute;top:5.2%;right:8%;font-size:20px;letter-spacing:2px;z-index:4}
.copy{position:absolute;left:8%;right:7%;top:13%;z-index:3}
h1{margin:0;font-size:126px;font-weight:800;line-height:1.04;letter-spacing:-6px}
.copy p{margin:36px 0 0;font-size:32px;line-height:1.5;max-width:95%;font-weight:600}
.phone{position:absolute;top:36%;left:14%;width:79%;border:11px solid #252525;border-radius:94px;overflow:hidden;background:#f8f9fb;box-shadow:0 36px 80px #0002;transform:rotate(-5deg);z-index:2}
.phone img{width:100%;display:block}
.orb{position:absolute;width:1150px;height:1150px;background:#ff9e65;border-radius:50%;left:-590px;top:46%}
.label{position:absolute;right:6%;bottom:11%;writing-mode:vertical-rl;font-size:23px;letter-spacing:5px;z-index:3}
.foot{position:absolute;left:0;right:0;bottom:0;padding:26px 20px;text-align:center;font-size:17px;letter-spacing:.7px;background:#ff6418;color:#351403;z-index:6}
.backdrop{display:none}
.index{display:none}
.signal h1 span{color:#fff}
.signal.alt{background:#fff5e9!important}.signal.alt h1 span{color:#e6550c}.signal.alt .orb{background:#ffdec3}.signal.alt .foot{background:#fff5e9;color:#65564c}
.signal.alt .phone{transform:rotate(5deg);left:8%}
.editorial{background:#fbfaf7!important}
.editorial .copy{top:15%;right:6%}.editorial h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-6px;font-size:138px;line-height:1.04}
.editorial h1 span{font-style:italic;color:#d65012}
.editorial .copy p{max-width:850px;font-size:30px;color:#5d5852}
.editorial .phone{top:39%;width:77%;left:31%;transform:rotate(0);border-width:9px;border-radius:83px}
.editorial .orb{border-radius:0;background:#e7e2d9;width:64%;height:45%;left:0;top:auto;bottom:0}
.editorial .label{right:auto;left:8%;bottom:19%;writing-mode:vertical-rl;transform:rotate(180deg);color:#716a60}
.editorial .foot{background:#fbfaf7;color:#666057}
.editorial .index{display:block;position:absolute;left:8%;bottom:5%;font-size:145px;font-family:Georgia,serif;color:#b4aa9c;z-index:4}
.postcard{color:#fff!important;background:#417c9a!important}
.postcard .backdrop{display:block;position:absolute;inset:0;background-size:cover;background-position:center}
.postcard .backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(#112c4a66 0%,#112c4a22 37%,#06182e22 65%,#06182e55 100%)}
.postcard .brand img{filter:brightness(0) invert(1)}
.postcard .copy{top:14%;text-align:center;left:6%;right:6%}
.postcard h1{font-size:123px;letter-spacing:-5px;text-shadow:0 4px 25px #102b4633}
.postcard .copy p{font-size:30px;max-width:870px;margin:32px auto 0}
.postcard .phone{width:69%;left:15.5%;top:37.5%;transform:rotate(0);border:9px solid #e4e1d8;border-radius:83px;box-shadow:0 40px 90px #05182c55}
.postcard .orb,.postcard .label{display:none}
.postcard .foot{background:#173343;color:#e6edf1}
.focus{background:#ede6d7!important}
.focus .copy{top:13%;right:8%}.focus h1{font-size:119px;line-height:1.05;letter-spacing:-5px}.focus h1 span{color:#aa481b}
.focus .phone{left:8%;width:105%;top:38%;transform:none;border:1px solid #dedbd4;border-radius:64px;box-shadow:0 18px 60px #4a3e2e18}
.focus .phone img{margin-top:-4%}
.focus .orb{display:none}
.focus .label{bottom:10%;right:auto;left:0;padding:28px 40px;background:#ff6418;color:#151515;writing-mode:horizontal-tb;font-size:26px;font-weight:800;letter-spacing:0;box-shadow:0 8px 24px #0001}
.focus .foot{background:#ede6d7;color:#62574a}
.night{background:#17191c!important;color:#f9f6ef!important}
.night .brand img{filter:none}
.night .category{color:#a8a9ad}
.night .copy{top:14%}.night h1{font-size:128px;letter-spacing:-5px}.night h1 span{color:#ff7934}
.night .copy p{font-size:30px;color:#b5b7bd;max-width:900px}
.night .orb{border:2px solid #54514d;background:none;border-radius:170px;left:8%;top:36%;width:84%;height:70%}
.night .phone{top:40%;left:19%;width:69%;transform:rotate(7deg);border-color:#626363;border-width:8px;border-radius:82px;box-shadow:0 50px 80px #0006}
.night .label{color:#ff7934;left:11%;right:auto;bottom:12%;font-size:21px}
.night .foot{background:#17191c;color:#a8a9ad}
#canvas.android{width:1080px;height:1920px;--w:1080px;--h:1920px}
.android .brand{font-size:32px;gap:14px}.android .brand img{width:42px;height:42px}.android .category{font-size:16px}
.android h1{font-size:100px;letter-spacing:-4.5px}
.android .copy{top:13.5%}.android .copy p{font-size:25px;margin-top:26px}
.android .phone{top:38%;width:76%;left:16%;border-width:8px;border-radius:74px}
.android .foot{font-size:13px;padding:20px}.android .label{font-size:18px}
.android.editorial h1{font-size:110px}.android.editorial .phone{left:33%;width:76%;top:42%}
.android.editorial .index{font-size:110px}
.android.postcard h1{font-size:98px}.android.postcard .copy p{max-width:750px}.android.postcard .phone{width:66%;left:17%;top:41%}
.android.focus h1{font-size:98px}.android.focus .phone{width:106%;left:8%;top:40%}
.android.night h1{font-size:102px}.android.night .phone{top:42%;width:70%;left:19%}.android.night .orb{top:38%}
.orange-air{background:#ff7b37!important}
.orange-air h1 span{color:#fff}.orange-air .copy{top:14%;left:8%;right:8%;text-align:center}.orange-air h1{font-size:118px;line-height:1.09}
.orange-air .copy p{font-size:30px;max-width:920px;margin:34px auto 0}
.orange-air .phone{width:64%;left:18%;top:39%;transform:none;border:9px solid #2c2927;border-radius:82px}
.orange-air .orb{background:#ff965f;width:110%;height:46%;border-radius:50% 50% 0 0;left:-5%;top:57%}
.orange-air .label{display:none}.orange-air .foot{background:#ff7b37;color:#422008}
.orange-bold{background:#ed5512!important}
.orange-bold .copy{top:12%;left:8%;right:5%}.orange-bold h1{font-size:133px;letter-spacing:-6px;line-height:1.03}.orange-bold h1 span{color:#fff}
.orange-bold .copy p{font-size:31px;max-width:94%}
.orange-bold .phone{top:38%;left:8%;width:95%;border:9px solid #26211e;border-radius:74px;transform:none;box-shadow:0 25px 60px #64200030}
.orange-bold .orb{display:none}.orange-bold .label{display:none}.orange-bold .foot{background:#ed5512;color:#301100}
.android.orange-air h1{font-size:94px;line-height:1.08}.android.orange-air .copy{top:14%}.android.orange-air .copy p{font-size:25px;max-width:810px;margin-top:25px}
.android.orange-air .phone{top:41%;width:63%;left:18.5%;border-width:7px;border-radius:65px}
.android.orange-bold h1{font-size:109px;line-height:1.02;letter-spacing:-4px}.android.orange-bold .copy p{font-size:25px}
.android.orange-bold .phone{top:40%;left:8%;width:95%;border-width:8px;border-radius:62px}
.brand{top:4.2%;left:7.4%;gap:0}
#canvas .brand img{width:500px;height:auto;filter:none;display:block}
#canvas.android .brand img{width:410px;height:auto;filter:none}
.signal:not(.alt) .category,.orange-air .category,.orange-bold .category{color:#fff;font-weight:800}
</style>
<div id="canvas"><div class="backdrop"></div><div class="orb"></div><div class="brand"><img src="./assets/wordmark-white.png" alt="Openline"></div><div class="category">TRAVEL eSIM</div><div class="copy"><h1></h1><p></p></div><div class="phone"><img id="screen" alt="Openline design reference"></div><div class="label"></div><div class="index"></div><div class="foot">DESIGN REFERENCE · SAMPLE DATA · REPLACE WITH NATIVE CAPTURE</div></div>
<script type="module">
const [config,art]=await Promise.all(['series.json','artwork.json'].map(async p=>(await fetch('./'+p)).json()));
const q=new URLSearchParams(location.search),n=Math.max(0,Math.min(5,Number(q.get('slide'))||0)),s=config.series.find(x=>x.id===q.get('series'))||config.series[0],slide=art.slides[n],platform=q.get('platform')==='android'?'android':'ios';
const canvas=document.querySelector('#canvas');canvas.className=s.id+' '+platform+(n%2?' alt':'');
document.querySelector('.brand img').src=`./assets/wordmark-${s.id==='signal'&&n%2?'black':'white'}.png`;
document.querySelector('h1').replaceChildren(document.createTextNode(s.heads[n][0]),document.createElement('br'),Object.assign(document.createElement('span'),{textContent:s.heads[n][1]}));
document.querySelector('.copy p').textContent=n===config.differentiator?.slide?config.differentiator.detail:slide.detail;
document.querySelector('#screen').src=slide.captures[platform];
document.querySelector('.label').textContent=slide.short;
document.querySelector('.index').textContent='0'+(n+1);
window.artworkReady=true;
</script></html>
