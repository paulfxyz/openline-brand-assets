<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify — Openline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Play:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #070c18; --card: #0c1120; --header: #090e1c;
  --text: #dde6ff; --muted: rgba(255,255,255,.45);
  --blue: #3B3BFF; --orange: #ff6616; --green: #22c55e;
  --gs: #1db954; --border: rgba(255,255,255,.07);
}
html, body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 20px; min-height: 100vh; }

.header { background: var(--header); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
.header-logo { display: flex; align-items: center; gap: 12px; flex: 1; }
.logo-svg { width: 44px; height: 44px; }
.header-eyebrow { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--gs); letter-spacing: .05em; }
.header-title { font-family: 'Play', sans-serif; font-size: 28px; font-weight: 700; line-height: 1; }
.conn-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(29,185,84,.15); border: 1px solid rgba(29,185,84,.3); color: var(--gs); font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 20px; }
.conn-dot { width: 7px; height: 7px; background: var(--gs); border-radius: 50%; animation: pdot 2.5s ease-in-out infinite; }
@keyframes pdot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
.close-btn { background: rgba(255,255,255,.07); border: 1px solid var(--border); color: var(--muted); width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0; }
.close-btn:hover { background: rgba(29,185,84,.15); color: var(--gs); border-color: rgba(29,185,84,.4); }

.main { display: grid; grid-template-columns: 1fr 340px; gap: 24px; padding: 28px 32px 48px; max-width: 1100px; margin: 0 auto; }
@media(max-width:800px){ .main{grid-template-columns:1fr;padding:16px;} }

.player-card { background: var(--card); border: 1px solid rgba(29,185,84,.2); border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 0 60px rgba(29,185,84,.08); }
.player-card::before { content:''; position:absolute; top:0;left:0;right:0; height:3px; background:linear-gradient(90deg,var(--gs),#4ade80); z-index:2; }

.player-head { padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between; }
.np-label { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--gs); letter-spacing: .1em; display: flex; align-items: center; gap: 8px; }
.eq { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
.eq span { display: block; width: 3px; background: var(--gs); border-radius: 2px; animation: eq 1.2s ease-in-out infinite; }
.eq span:nth-child(1){height:5px;animation-delay:0s}
.eq span:nth-child(2){height:10px;animation-delay:.2s}
.eq span:nth-child(3){height:7px;animation-delay:.4s}
.eq span:nth-child(4){height:12px;animation-delay:.1s}
@keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.8)}}

.sp-iframe-wrap { padding: 16px 20px 0; }
#sp-embed { border-radius: 12px; display: block; width: 100%; }

.player-foot { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 12px; }
.cur-track { display: flex; align-items: center; justify-content: space-between; }
.cur-meta { display: flex; flex-direction: column; gap: 3px; }
.cur-title { font-family: 'Play', sans-serif; font-size: 20px; font-weight: 700; }
.cur-artist { font-size: 15px; color: var(--muted); }
.heart-btn { background: none; border: 1px solid var(--border); color: var(--muted); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.heart-btn.liked { color: var(--gs); border-color: rgba(29,185,84,.4); background: rgba(29,185,84,.1); }
.heart-btn:hover { color: var(--gs); border-color: rgba(29,185,84,.4); }

.stats-row { display: flex; gap: 12px; }
.stat { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; flex: 1; text-align: center; }
.stat-v { font-family: 'Play', sans-serif; font-size: 22px; font-weight: 700; color: var(--gs); display: block; }
.stat-l { font-size: 12px; color: var(--muted); }

.open-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--gs); color: #000; border: none; border-radius: 50px; padding: 14px 24px; font-size: 16px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; transition: all .2s; text-decoration: none; width: 100%; }
.open-btn:hover { background: #24cf63; transform: scale(1.02); }

.right-col { display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
.card-eyebrow { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--muted); letter-spacing: .1em; margin-bottom: 14px; }
.card-h { font-family: 'Play', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 16px; }

.q-items { display: flex; flex-direction: column; gap: 6px; }
.q-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: all .2s; border: 1px solid transparent; }
.q-item:hover { background: rgba(255,255,255,.04); border-color: var(--border); }
.q-item.active { background: rgba(29,185,84,.08); border-color: rgba(29,185,84,.25); }
.vinyl { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; font-size: 10px; font-weight: 700; color: rgba(255,255,255,.7); }
.vinyl::after { content:''; position:absolute; width:12px; height:12px; background:var(--card); border-radius:50%; border:2px solid rgba(255,255,255,.15); }
.q-item.active .vinyl { animation: spin 3s linear infinite; }
@keyframes spin{100%{transform:rotate(360deg)}}
.q-item.active .vinyl::after { animation: cspin 3s linear infinite; }
@keyframes cspin{100%{transform:rotate(-360deg)}}
.q-meta { flex: 1; min-width: 0; }
.q-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.q-artist { font-size: 12px; color: var(--muted); }
.q-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.q-dur { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.q-play { background: none; border: 1px solid var(--border); color: var(--muted); width: 30px; height: 30px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.q-item:hover .q-play, .q-item.active .q-play { border-color: rgba(29,185,84,.4); color: var(--gs); background: rgba(29,185,84,.1); }

.listener-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.l-chip { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 50px; padding: 6px 14px 6px 6px; font-size: 14px; }
.l-av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.l-name { font-weight: 500; }
.l-dot { width: 7px; height: 7px; background: var(--gs); border-radius: 50%; margin-left: 4px; animation: pdot 2s ease-in-out infinite; }
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <svg class="logo-svg" viewBox="0 0 44 44" fill="none" aria-label="Spotify">
      <rect width="44" height="44" rx="22" fill="#1db954"/>
      <path d="M31.5 20.3c-4.9-2.9-12.9-3.2-17.6-1.8-.7.2-1.5-.2-1.7-1s.2-1.5 1-1.7c5.3-1.6 14.2-1.3 19.8 2 .7.4.9 1.3.5 2s-1.3.9-2 .5zM31.2 24.3c-.4.6-1.1.8-1.7.4-4-2.5-10.2-3.2-14.9-1.8-.6.2-1.3-.2-1.5-.8s.2-1.3.8-1.5c5.4-1.6 12.1-.8 16.7 2.1.6.4.8 1.1.6 1.6zM29.2 28.2c-.3.5-.9.6-1.4.3-3.5-2.1-7.9-2.6-13-1.4-.5.1-1-.2-1.1-.7s.2-1 .7-1.1c5.6-1.3 10.5-.7 14.4 1.6.5.2.6.9.4 1.3z" fill="white"/>
    </svg>
    <div>
      <div class="header-eyebrow">OPENLINE</div>
      <div class="header-title">Spotify</div>
    </div>
    <div class="conn-badge"><span class="conn-dot"></span>Connected</div>
  </div>
  <button class="close-btn" onclick="window.parent.postMessage({type:'spotify-close'},'*'); try{history.back()}catch(e){}">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 2l14 14M16 2L2 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</header>

<main class="main">
  <div class="player-card">
    <div class="player-head">
      <div class="np-label">
        <div class="eq"><span></span><span></span><span></span><span></span></div>
        NOW PLAYING
      </div>
    </div>
    <div class="sp-iframe-wrap">
      <iframe id="sp-embed" style="border-radius:12px"
        src="https://open.spotify.com/embed/track/0DiWol3AO6WpXZgdaGKTIe?utm_source=generator&theme=0"
        width="100%" height="352" frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <div class="player-foot">
      <div class="cur-track">
        <div class="cur-meta">
          <div class="cur-title" id="cur-title">Get Lucky</div>
          <div class="cur-artist" id="cur-artist">Daft Punk &middot; Random Access Memories</div>
        </div>
        <button class="heart-btn" id="heart-btn" onclick="toggleHeart()">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" id="heart-svg"><path d="M10 17s-7-4.35-7-9a4 4 0 018 0 4 4 0 018 0c0 4.65-7 9-7 9z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
      </div>
      <div class="stats-row">
        <div class="stat"><span class="stat-v" id="s-listen">4</span><span class="stat-l">Listening</span></div>
        <div class="stat"><span class="stat-v" id="s-streak">7</span><span class="stat-l">Day Streak</span></div>
        <div class="stat"><span class="stat-v" id="s-played">23</span><span class="stat-l">Played Today</span></div>
      </div>
      <a href="https://open.spotify.com" target="_blank" class="open-btn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect width="20" height="20" rx="10" fill="rgba(0,0,0,.2)"/><path d="M14 7.5c-2.2-1.3-5.8-1.4-7.9-.8-.3.1-.7-.1-.8-.5s.1-.7.5-.8c2.4-.7 6.4-.6 8.9.9.3.2.4.6.2.9s-.6.4-.9.3z" fill="white"/><path d="M13.9 9.3c-.2.3-.5.4-.8.2-1.8-1.1-4.6-1.4-6.7-.8-.3.1-.6-.1-.7-.4s.1-.6.4-.7c2.4-.7 5.5-.4 7.5.9.3.2.4.5.3.8z" fill="white"/><path d="M13 11c-.1.2-.4.3-.6.1-1.6-1-3.6-1.2-5.9-.6-.2.1-.4-.1-.5-.3s.1-.4.3-.5c2.5-.6 4.7-.3 6.5.7.2.1.3.4.2.6z" fill="white"/></svg>
        Open in Spotify
      </a>
    </div>
  </div>

  <div class="right-col">
    <div class="card">
      <div class="card-eyebrow">&#9654; UP NEXT</div>
      <div class="card-h">Queue</div>
      <div class="q-items" id="q-items"></div>
    </div>
    <div class="card">
      <div class="card-eyebrow">&#128101; TEAM</div>
      <div class="card-h">Also Listening</div>
      <div class="listener-list">
        <div class="l-chip"><div class="l-av" style="background:linear-gradient(135deg,#3B3BFF,#7B7BFF)">&#128526;</div><span class="l-name">Alex</span><span class="l-dot"></span></div>
        <div class="l-chip"><div class="l-av" style="background:linear-gradient(135deg,#ff6616,#ff9a5c)">&#127911;</div><span class="l-name">Jordan</span><span class="l-dot"></span></div>
        <div class="l-chip"><div class="l-av" style="background:linear-gradient(135deg,#22c55e,#4ade80)">&#127925;</div><span class="l-name">Sam</span><span class="l-dot"></span></div>
        <div class="l-chip"><div class="l-av" style="background:linear-gradient(135deg,#a855f7,#c084fc)">&#10024;</div><span class="l-name">Riley</span><span class="l-dot"></span></div>
      </div>
    </div>
  </div>
</main>

<script>
const tracks = [
  {id:'0DiWol3AO6WpXZgdaGKTIe',title:'Get Lucky',artist:'Daft Punk',album:'Random Access Memories',dur:'4:07',color:'#ff6616',grad:'linear-gradient(135deg,#ff6616,#ff9a5c)',lbl:'GL'},
  {id:'4cOdK2wGLETKBW3PvgPWqT',title:'Never Gonna Give You Up',artist:'Rick Astley',album:'Whenever You Need Somebody',dur:'3:33',color:'#3B3BFF',grad:'linear-gradient(135deg,#3B3BFF,#7B7BFF)',lbl:'RA'},
  {id:'7qiZfU4dY1lWllzX7mPBI3',title:'Shape of You',artist:'Ed Sheeran',album:'Divide',dur:'3:53',color:'#22c55e',grad:'linear-gradient(135deg,#22c55e,#4ade80)',lbl:'ES'},
  {id:'11dFghVXANMlKmJXsNCbNl',title:'Smells Like Teen Spirit',artist:'Nirvana',album:'Nevermind',dur:'5:01',color:'#a855f7',grad:'linear-gradient(135deg,#a855f7,#c084fc)',lbl:'NV'},
  {id:'06AKEBrKUckW0KREUWRnvT',title:'The Less I Know The Better',artist:'Tame Impala',album:'Currents',dur:'3:37',color:'#ec4899',grad:'linear-gradient(135deg,#ec4899,#f472b6)',lbl:'TI'},
  {id:'3AJwUDP919kvQ9QcozQPxg',title:'Running Up That Hill',artist:'Kate Bush',album:'Hounds of Love',dur:'5:02',color:'#06b6d4',grad:'linear-gradient(135deg,#06b6d4,#22d3ee)',lbl:'KB'},
];

let cur = 0;
let liked = false;

function render() {
  document.getElementById('q-items').innerHTML = tracks.map((t,i) => `
    <div class="q-item ${i===cur?'active':''}" onclick="play(${i})">
      <div class="vinyl" style="background:${t.grad}">${t.lbl}</div>
      <div class="q-meta"><div class="q-title">${t.title}</div><div class="q-artist">${t.artist}</div></div>
      <div class="q-right">
        <span class="q-dur">${t.dur}</span>
        <button class="q-play" onclick="event.stopPropagation();play(${i})">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 1l7 4-7 4V1z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>`).join('');
}

function play(i) {
  cur = i;
  const t = tracks[i];
  document.getElementById('sp-embed').src =
    `https://open.spotify.com/embed/track/${t.id}?utm_source=generator&theme=0`;
  document.getElementById('cur-title').textContent = t.title;
  document.getElementById('cur-artist').textContent = `${t.artist} \u00b7 ${t.album}`;
  liked = false; updateHeart(); render();
}

function toggleHeart() { liked = !liked; updateHeart(); }

function updateHeart() {
  const btn = document.getElementById('heart-btn');
  const svg = document.getElementById('heart-svg');
  btn.classList.toggle('liked', liked);
  svg.innerHTML = liked
    ? '<path d="M10 17s-7-4.35-7-9a4 4 0 018 0 4 4 0 018 0c0 4.65-7 9-7 9z" fill="currentColor"/>'
    : '<path d="M10 17s-7-4.35-7-9a4 4 0 018 0 4 4 0 018 0c0 4.65-7 9-7 9z" stroke="currentColor" stroke-width="1.5" fill="none"/>';
}

setInterval(() => {
  if (Math.random() > .85) {
    const v = Math.max(2, Math.min(8, parseInt(document.getElementById('s-listen').textContent) + (Math.random()>.5?1:-1)));
    document.getElementById('s-listen').textContent = v;
  }
  if (Math.random() > .9) {
    document.getElementById('s-played').textContent = parseInt(document.getElementById('s-played').textContent) + 1;
  }
}, 7000);

render();
</script>
</body>
</html>
